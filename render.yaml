# Render Blueprint: 백엔드(FastAPI) 무료 웹 서비스
# DATABASE_URL 등 비밀 값은 Render 대시보드에서 직접 입력한다 (sync: false).
services:
  - type: web
    name: glin-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://glin.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
